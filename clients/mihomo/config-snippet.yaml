# =====================================================================
# 原生 mihomo / Mihomo Party / ClashX Meta / FlClash 等客户端配置片段
# 用法：把下面的 rule-providers 块并入主配置，把 5 条 RULE-SET 放到 rules 最前面。
# 策略组名（Google/Proxies/Steam）必须是本订阅里真实存在的组；
# 没有对应细分组就统一改成总代理组（如 Proxies / 节点选择）。
# macOS/Linux：删除 online-windows 那一行（PROCESS-NAME 仅 Windows 生效）。
# 国内拉不到就把 url 换成 https://gcore.jsdelivr.net/gh/Azhi-ss/clash-rules@main/rules/<file>
# =====================================================================

rule-providers:
  online-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Azhi-ss/clash-rules/main/rules/direct.yaml
    interval: 86400
    proxy: Proxies
    path: ./providers/online-direct.yaml
  online-windows:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Azhi-ss/clash-rules/main/rules/windows-direct.yaml
    interval: 86400
    proxy: Proxies
    path: ./providers/online-windows.yaml
  online-google:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Azhi-ss/clash-rules/main/rules/google.yaml
    interval: 86400
    proxy: Proxies
    path: ./providers/online-google.yaml
  online-proxy:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Azhi-ss/clash-rules/main/rules/proxy.yaml
    interval: 86400
    proxy: Proxies
    path: ./providers/online-proxy.yaml
  online-steam:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Azhi-ss/clash-rules/main/rules/steam.yaml
    interval: 86400
    proxy: Proxies
    path: ./providers/online-steam.yaml

rules:
  # 放在 rules 最前面；macOS/Linux 删除 windows 那一行
  - RULE-SET,online-windows,DIRECT
  - RULE-SET,online-direct,DIRECT
  - RULE-SET,online-google,Google
  - RULE-SET,online-proxy,Proxies
  - RULE-SET,online-steam,Steam
  # …原有规则接在后面…
